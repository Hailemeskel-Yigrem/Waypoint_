services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waypoint_test
      POSTGRES_PASSWORD: waypoint_test
      POSTGRES_DB: waypoint_test
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waypoint_test -d waypoint_test']
      interval: 2s
      timeout: 5s
      retries: 15

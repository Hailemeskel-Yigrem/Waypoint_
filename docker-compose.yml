services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      - "5432:5432"
    volumes:
      - wp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://waypoint:waypoint@postgres:5432/waypoint
      REDIS_URL: redis://redis:6379
      JWT_SECRET: waypoint-dev-secret-key
      PORT: "3000"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://waypoint:waypoint@postgres:5432/waypoint
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: bash -lc "corepack enable && pnpm --filter @waypoint/web dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

  portal:
    image: node:22-bookworm-slim
    working_dir: /app
    command: bash -lc "corepack enable && pnpm --filter @waypoint/portal dev --host 0.0.0.0 --port 5174"
    volumes:
      - ./:/app
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5174:5174"
    depends_on:
      - api

volumes:
  wp_pg:
